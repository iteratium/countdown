<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Clock</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="confetti" aria-hidden="true"></div>
  <main>
    <div id="cat"><img id="meme" alt="" /></div>
    <h1 id="mood">—</h1>
    <p id="countdown">-:--:--</p>
    <p id="clock">--:--</p>
    <p id="quote"></p>
    <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="sun">☀️</div>
      <div id="path"></div>
      <div id="home-start">🏠</div>
      <div id="home-end">🏠</div>
      <div id="walker">🐱</div>
    </div>
    <p id="attribution"><a href="https://giphy.com" target="_blank" rel="noopener">Powered by GIPHY</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
