<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Clock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="confetti" aria-hidden="true"></div>
  <main>
    <section class="col col-mood">
      <div id="cat" role="button" tabindex="0" aria-label="Show another cat meme"><img id="meme" alt="" /></div>
      <p class="hint" aria-hidden="true">tap for a new meme</p>
      <h1 id="mood">—</h1>
      <p id="countdown">-:--:--</p>
      <p id="clock">--:--</p>
      <p id="quote"></p>
    </section>
    <section class="col col-office">
      <div id="office" role="button" tabindex="0" aria-label="Cat office. Click to add another cat.">
        <svg id="office-scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#f7ead6" />
          <rect id="office-wall" y="0" width="320" height="86" fill="#cfe3dc" />
          <rect y="84" width="320" height="4" fill="#2e2b3f" />
          <!-- glass wall with the Tokyo skyline -->
          <clipPath id="window-clip"><rect x="36" y="8" width="186" height="76" rx="2" /></clipPath>
          <g clip-path="url(#window-clip)">
            <rect id="office-window" x="36" y="8" width="186" height="76" fill="#bfe3f2" />
            <g class="cloud" fill="#fdf6ec">
              <ellipse cx="124" cy="20" rx="9" ry="3.5" /><ellipse cx="129" cy="17.5" rx="5" ry="3.5" />
              <ellipse cx="196" cy="15" rx="7" ry="3" /><ellipse cx="200" cy="13" rx="4" ry="3" />
            </g>
            <g class="city-far" fill="#b4ccd6">
              <rect x="38" y="44" width="10" height="26" /><rect x="47" y="36" width="8" height="34" />
              <rect x="56" y="48" width="9" height="22" /><rect x="86" y="40" width="10" height="30" />
              <rect x="95" y="46" width="12" height="24" /><rect x="108" y="32" width="8" height="38" />
              <rect x="117" y="50" width="12" height="20" /><rect x="198" y="42" width="9" height="28" />
              <rect x="207" y="50" width="16" height="20" />
            </g>
            <g class="lit" fill="#f2cc8f">
              <rect x="49" y="40" width="2" height="2" /><rect x="49" y="48" width="2" height="2" />
              <rect x="110" y="36" width="2" height="2" /><rect x="110" y="46" width="2" height="2" />
              <rect x="89" y="44" width="2" height="2" /><rect x="201" y="46" width="2" height="2" />
            </g>
            <!-- Tokyo Tower -->
            <g stroke="#2e2b3f" stroke-width="1" stroke-linejoin="round">
              <path d="M72 9 V20" stroke-width="1.2" />
              <polygon points="70.5,20 73.5,20 76,40 68,40" fill="#e07a5f" />
              <path d="M69.3 30 h5.4" stroke="#fdf6ec" stroke-width="1.6" />
              <rect x="66.5" y="40" width="11" height="3" fill="#fdf6ec" />
              <polygon points="68,43 76,43 79,52 65,52" fill="#e07a5f" />
              <rect x="63" y="52" width="18" height="4" fill="#fdf6ec" />
              <polygon points="65,56 79,56 85,69 79,69 72,61 65,69 59,69" fill="#e07a5f" />
            </g>
            <g class="city-near" fill="#97b5c3">
              <rect x="36" y="56" width="14" height="14" /><rect x="52" y="60" width="9" height="10" />
              <rect x="84" y="57" width="12" height="13" /><rect x="97" y="52" width="8" height="18" />
              <rect x="104" y="58" width="12" height="12" />
            </g>
            <g class="lit" fill="#f2cc8f">
              <rect x="40" y="60" width="2" height="2" /><rect x="45" y="64" width="2" height="2" />
              <rect x="99" y="56" width="2" height="2" /><rect x="88" y="62" width="2" height="2" />
            </g>
            <rect class="bay" x="36" y="69" width="186" height="15" fill="#9fcfe0" />
            <!-- Rainbow Bridge -->
            <g stroke="#2e2b3f" stroke-linecap="round">
              <path d="M150 45.2 V62 M158 49.5 V62 M166 51 V62 M174 49.5 V62 M182 45.2 V62 M124 56 V62 M130 52 V62 M198 47 V62 M206 53 V62" stroke-width="0.6" />
              <path d="M112 60 Q128 58 142 38 Q166 64 190 38 Q204 58 224 58" fill="none" stroke-width="1.2" />
              <rect x="139" y="36" width="6" height="36" fill="#fdf6ec" stroke-width="1.2" />
              <rect x="187" y="36" width="6" height="36" fill="#fdf6ec" stroke-width="1.2" />
              <path d="M142 46 V72 M190 46 V72 M139 42 h6 M187 42 h6" stroke-width="0.8" />
              <rect x="110" y="62" width="116" height="3" fill="#fdf6ec" stroke-width="1.2" />
            </g>
            <!-- glass glare -->
            <g fill="#fff" opacity="0.3">
              <polygon points="44,84 66,8 72,8 50,84" /><polygon points="54,84 76,8 78,8 56,84" />
              <polygon points="168,84 190,8 196,8 174,84" />
            </g>
          </g>
          <path d="M98 8 V84 M160 8 V84" stroke="#2e2b3f" stroke-width="2" />
          <rect x="36" y="8" width="186" height="76" rx="2" fill="none" stroke="#2e2b3f" stroke-width="2.5" />
          <!-- coffee corner -->
          <rect x="226" y="70" width="28" height="16" fill="#c98f5a" stroke="#2e2b3f" stroke-width="2" />
          <rect x="232" y="44" width="16" height="26" rx="2" fill="#5b5670" stroke="#2e2b3f" stroke-width="2" />
          <rect x="235" y="48" width="10" height="7" rx="1" fill="#9be3c4" />
          <rect x="236" y="62" width="8" height="8" fill="#fdf6ec" stroke="#2e2b3f" stroke-width="1.5" />
          <path class="steam" d="M238 60 q-2 -4 0 -7 M242 60 q2 -4 0 -7" fill="none" stroke="#2e2b3f" stroke-width="1.2" stroke-linecap="round" />
          <!-- meeting room -->
          <rect x="258" y="34" width="58" height="52" rx="3" fill="#bfe3f2" fill-opacity="0.55" stroke="#2e2b3f" stroke-width="2" />
          <rect x="264" y="42" width="30" height="20" rx="1" fill="#fff" stroke="#2e2b3f" stroke-width="1.5" />
          <path d="M268 48 h14 M268 53 h20 M268 58 h10" stroke="#e07a5f" stroke-width="1.5" stroke-linecap="round" />
          <path d="M304 34 V86" stroke="#2e2b3f" stroke-width="1.5" />
          <text x="287" y="30" text-anchor="middle" font-size="7" font-weight="700" fill="#2e2b3f" font-family="sans-serif">MEETING</text>
          <ellipse cx="262" cy="143" rx="8" ry="3" fill="#5b5670" />
          <ellipse cx="308" cy="143" rx="8" ry="3" fill="#5b5670" />
          <ellipse cx="285" cy="157" rx="8" ry="3" fill="#5b5670" />
          <rect x="282" y="128" width="6" height="10" fill="#2e2b3f" />
          <ellipse cx="285" cy="126" rx="27" ry="8" fill="#c98f5a" stroke="#2e2b3f" stroke-width="2" />
          <rect x="14" y="62" width="14" height="22" rx="2" fill="#c98f5a" stroke="#2e2b3f" stroke-width="2" />
          <path d="M21 62 Q10 46 16 38 M21 62 Q30 44 27 34 M21 62 V36" stroke="#81b29a" stroke-width="4" fill="none" stroke-linecap="round" />
          <g id="office-desks"></g>
          <g id="office-cats"></g>
        </svg>
      </div>
      <p class="hint" aria-hidden="true">tap to hire a cat 🐾</p>
      <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="sun">☀️</div>
        <div id="path"></div>
        <div id="home-start">🏠</div>
        <div id="home-end">🏠</div>
        <div id="walker">🐱</div>
        <span class="progress-label" id="label-start"></span>
        <span class="progress-label" id="label-end"></span>
      </div>
    </section>
    <p id="attribution">Cat Clock v2 · <a href="https://giphy.com" target="_blank" rel="noopener">Powered by GIPHY</a></p>
  </main>
  <script src="script.js"></script>
  <script src="office.js"></script>
</body>
</html>
